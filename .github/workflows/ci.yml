---
name: CI

on:
  push:
    branches: [main, ci]
  pull_request:
    branches: [main, ci]
  workflow_dispatch:

env:
  RUSTFLAGS: "-D warnings"
  RUSTUP_TOOLCHAIN: "1.95"

jobs:
  check:
    runs-on: ubuntu-latest
    container: rust:1.95
    timeout-minutes: 5

    steps:
      - name: checkout
        uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95
          components: clippy
      - name: install build dependencies
        run: apt-get update && apt-get install -y protobuf-compiler
      - name: clippy
        run: |
          cargo clippy --workspace --all-targets
          cargo clippy -p reticulum --all-targets --all-features
          cargo clippy -p reticulum-core --no-default-features --features="embassy-time"
      - name: no_std bare-metal check
        run: |
          rustup target add thumbv7em-none-eabihf
          cargo check -p reticulum-core --no-default-features --features no_std --target thumbv7em-none-eabihf

  test:
    runs-on: ubuntu-latest
    container: rust:1.95
    needs: check
    timeout-minutes: 10
    env:
      RETICULUM_TEST_PYTHON_DIR: /opt/Reticulum
      PYTHONPATH: /opt/Reticulum
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
      - name: install dependencies
        run: apt-get update && apt-get install -y git protobuf-compiler python3
      - name: checkout Reticulum
        run: |
          git clone https://github.com/markqvist/Reticulum.git "$RETICULUM_TEST_PYTHON_DIR"
          echo "Reticulum rev $(cd $RETICULUM_TEST_PYTHON_DIR && git rev-parse HEAD)"
      - name: verify Reticulum install
        run: python3 -c "import RNS; print(RNS.__file__)"
      - name: test
        run: |
          cargo test --workspace --all-targets --features="python-tests" -- --no-capture
          cargo test -p reticulum-core --all-targets --no-default-features --features="embassy-time"
          # bzip2 compression matrix for resources
          cargo test -p reticulum --features bz2 --test resource_transfer

  windows-storage:
    runs-on: windows-latest
    needs: check
    timeout-minutes: 10

    steps:
      - name: checkout
        uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95
      - name: install protoc
        uses: arduino/setup-protoc@v3
      - name: test atomic storage replacement
        run: cargo test -p reticulum --lib storage::tests::filesystem_writes_replace_existing_files_and_clean_temporaries
