[package]
name = "reticulum-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
aes = { version = "0.8.4", default-features = false }
cipher = { version = "0.4.4", default-features = false, features = ["block-padding", "rand_core"] }
cbc = { version = "0.1.2", default-features = false }
crypto-common = { version = "0.1.6", default-features = false }
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["rand_core"] }
embassy-time = { version = "0.5.1", optional = true }
hkdf = { version = "0.12.4", default-features = false }
hmac = { version = "0.12.1", default-features = false }
log = "0.4.27"
# `getrandom` (OS entropy) is only available on hosted targets; bare-metal
# users provide their own RNG via `CryptoRngCore`.
rand_core = { version = "0.6.4", default-features = false }
rmp = { version = "0.8.14", default-features = false }
sha2 = { version = "0.10.8", default-features = false }
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets"] }

[features]
default = ["std"]
fernet-aes128 = []
std = ["rand_core/getrandom"]
no_std = ["dep:embassy-time"]
