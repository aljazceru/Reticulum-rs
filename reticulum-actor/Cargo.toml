[package]
name = "reticulum-actor"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib"]

[features]
default = []
iface-auto = ["reticulum/iface-auto"]
iface-serial = ["reticulum/iface-serial"]
iface-pipe = ["reticulum/iface-pipe"]
iface-i2p = ["reticulum/iface-i2p"]
iface-rnode = ["reticulum/iface-rnode"]
iface-backbone = []

[dependencies]
reticulum = { version = "*", path = ".." }
lxmf = { path = "../lxmf" }
lxst = { path = "../lxst" }
reticulum-discovery = { path = "../reticulum-discovery" }
flume = "0.11"
tokio = { version = "1.44.2", features = ["rt-multi-thread", "time", "net", "macros", "sync"] }
rand_core = "0.6.4"
log = "0.4"

[dev-dependencies]
env_logger = "0.10"
reticulum = { version = "*", path = ".." }
lxst = { path = "../lxst" }
criterion = "0.5"

[[bench]]
name = "actor"
harness = false
